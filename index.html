    ${body}
    ${busy?'':`<div class="btns"><button type="button" class="b primary" id="wAgain">${st==='wait'?'別の試合を探す':'もう一度探す'}</button></div>`}
    <p class="note">観戦中は、どちらの手札と心臓も見えません。見えるのは、使われたカードと、相手に知られたカードだけです。</p>`;
  $('#wBack').onclick=watchLeave;
  const a=$('#wAgain');if(a)a.onclick=()=>watchStart();
}

/* 部屋の画面 */
function roomLink(){return location.origin+location.pathname+'?room='+NET.code}
function renderOnline(){
  if(VIEW!=='online')return;
  setBg(null);
  const st=NET.state,on=!!(NET.conn&&NET.conn.open);
  let body='';
  if(on){
    const me=NET.ready.me,op=NET.ready.cpu;
    body=`<div class="onCard"><p class="onBig">${esc(NET.opp||'相手')} さんとつながりました</p>
      <div class="onStat"><span>あなた：<b>${me?'デッキ準備OK':'デッキ準備中'}</b></span><span>${esc(NET.opp||'相手')}：<b>${op?'デッキ準備OK':'デッキ準備中'}</b></span></div>
      ${LADDER.on()?`<p class="rateLine">${LADDER.rated()?`<b>ランク戦</b>　${esc(NET.opp||'相手')}さん：${NET.oppRp!=null?tierHTML(NET.oppRp):'？'}`:LADDER.uid()?`${esc(NET.opp||'相手')}さんがログインしていないので、ランクに関係しない対戦になります。`:'あなたがログインしていないので、ランクに関係しない対戦になります（メニューからGoogleでログインできます）。'}</p>`:''}
      ${me?`<p class="note">${op?'まもなく始まります…':`${esc(NET.opp||'相手')}さんのデッキができるのを待っています…`}</p>`
        :`<p class="note">おたがいにデッキを用意すると対戦が始まります。</p><div class="menu">
          <button type="button" class="mi main" id="oDraft"><b>7パック開けてデッキを作る</b><span>いつもの対戦と同じく、出たカードでデッキを組みます</span></button>
          <button type="button" class="mi" id="oQuick"><b>おまかせデッキですぐ対戦</b><span>パックを自動で開けて、デッキも自動で組みます</span></button>
          ${!LADDER.rated()&&freeOk(freeDeck())?`<button type="button" class="mi" id="oFree"><b>構築済みデッキで対戦</b><span>${catSummary(freeDeck().types)}・シングル〈${N(freeDeck().single)}〉（メニューの「構築済みデッキで対戦」で編集）</span></button>`:''}
          ${NET.lastDeck?`<button type="button" class="mi" id="oSame"><b>前と同じデッキで対戦</b><span>${catSummary(NET.lastDeck.types)}・シングル〈${N(NET.lastDeck.single)}〉</span></button>`:''}</div>`}</div>`;
  }else if(st==='opening'||st==='joining'){
    body=MM.on?`<div class="onCard mmCard"><div class="mmSpin"></div><p class="onBig">${MM.joining?'相手が見つかりました。つないでいます…':'対戦相手を探しています…'}</p><p class="note">待ち時間 <b id="mmTime">${mmElapsed()}</b></p><div class="btns"><button type="button" class="b" id="mmCancel">探すのをやめる</button></div></div>`
    :`<div class="onCard"><p class="onBig">${st==='opening'?'部屋を用意しています…':'部屋につないでいます…'}</p>${st==='joining'?`<p class="note">部屋コード <b>${esc(NET.code)}</b></p>`:''}</div>`;
  }else if(st==='waiting'&&MM.on){
    body=`<div class="onCard mmCard"><div class="mmSpin"></div><p class="onBig">対戦相手を探しています…</p><p class="note">待ち時間 <b id="mmTime">${mmElapsed()}</b>・いま探している人 <b id="mmCount">${MM.waiting||1}</b>人</p><p class="note">この画面を開いたまま待ってください。見つかると自動でつながります。</p><div class="btns"><button type="button" class="b" id="mmCancel">探すのをやめる</button></div></div>`;
  }else if(st==='waiting'){
    body=`<div class="onCard"><p class="label">部屋コード</p><div class="roomCode">${esc(NET.code)}</div>
      <p class="note">このリンクを友達に送ってください。友達がリンクを開いて「参加する」を押すとつながります。</p>
      <div class="linkBox"><input id="oLink" readonly value="${esc(roomLink())}"></div>
      <div class="btns"><button type="button" class="b primary" id="oCopy">リンクをコピー</button>${navigator.share?'<button type="button" class="b" id="oShare">送る</button>':''}</div>
      <p class="note">この画面を開いたまま待ってください（閉じると部屋が消えます）。</p></div>`;
  }else{
    body=`<div class="onCard"><span class="label">あなたの名前（相手に表示されます）</span><div class="nameRow">${nameEdHTML('oName')}</div></div>
      <div class="menu">
        ${LADDER.on()?`<div class="mi"><b>ランクマッチ</b><span>${LADDER.uid()?'いま対戦相手を探している人と自動でマッチングします。勝つとランクが上がります。':'Googleでログインすると、知らない人とも自動でマッチングして対戦できます。'}</span><div class="btns" ${LADDER.uid()?'':'data-gsi'}>${LADDER.uid()?'<button type="button" class="b primary" id="oMatch">相手を探す</button>':'<button type="button" class="b primary" id="oLogin">Googleでログイン</button>'}</div></div>`:''}
        <div class="mi"><b>部屋を作る</b><span>部屋コードとリンクができます。それを友達に送ります。</span><div class="btns"><button type="button" class="b primary" id="oHost">部屋を作る</button></div></div>
        <div class="mi"><b>部屋に参加する</b><span>友達から届いた5文字のコードを入れます。</span><div class="btns"><input id="oCode" class="codeIn" maxlength="5" autocapitalize="characters" autocomplete="off" value="${esc(NET.code||'')}" placeholder="ABCDE"><button type="button" class="b primary" id="oJoin">参加する</button></div></div>
      </div>`;
  }
  $('#app').innerHTML=`<div class="sceneBanner"><img src="scenes/home_b.png" alt=""><div class="sbText"><b>友達と対戦</b><span>部屋を作って、リンクを送るだけ</span></div></div><div class="top"><span></span><button type="button" class="b small" id="oBack">${on?'接続を切ってメニューへ':'メニューへ'}</button></div>
    ${NET.err?`<div class="onErr">${esc(NET.err)}</div>`:''}
    ${body}
    <p class="note">通信はブラウザどうしで直接つなぎます（PeerJS）。学校や会社のネットワークでは、つながらないことがあります。</p>`;
  const bk=$('#oBack');bk.onclick=()=>{if(on||NET.peer){NET.err='';netLeave()}else{NET.err='';go('menu')}};
  bindNameEd('oName',renderOnline);
  const h=$('#oHost');if(h)h.onclick=()=>netHost();
  const om=$('#oMatch');if(om)om.onclick=()=>{NET.err='';mmStart()};
  const ol=$('#oLogin');if(ol)ol.onclick=()=>LADDER.login();
  gsiRender();
  const mc=$('#mmCancel');if(mc)mc.onclick=()=>{mmStop();netReset();NET.err='';renderOnline()};
  const j=$('#oJoin');if(j){const ci=$('#oCode');j.onclick=()=>netJoin(ci.value);ci.onkeydown=e=>{if(e.key==='Enter')netJoin(ci.value)}}
  const cp=$('#oCopy');if(cp)cp.onclick=async()=>{const li=$('#oLink');try{await navigator.clipboard.writeText(li.value);cp.textContent='コピーしました'}catch(e){li.select();try{document.execCommand('copy');cp.textContent='コピーしました'}catch(_){cp.textContent='上の文字を長押ししてコピー'}}};
  const sh=$('#oShare');if(sh)sh.onclick=()=>{navigator.share({title:'心臓人狼',text:'心臓人狼で対戦しよう！',url:roomLink()}).catch(()=>{})};
  const od=$('#oDraft');if(od)od.onclick=()=>{NET.err='';startDraft()};
  const oq=$('#oQuick');if(oq)oq.onclick=()=>{NET.err='';const cd=newDraft();cd.packs.forEach(pk=>addPulls(cd,pk));fillPool(cd);netDeck(autoBuild(cd.pool,cd.singles,3))};
  const of=$('#oFree');if(of)of.onclick=()=>{NET.err='';const d=freeDeck();netDeck({types:[...d.types],single:d.single})};
  const os=$('#oSame');if(os)os.onclick=()=>{NET.err='';netDeck(NET.lastDeck)};
}

let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(VIEW==='battle'&&S&&!S.busy)render()},200)});
$('#app').addEventListener('click',e=>{
  if(VIEW!=='battle')return;
  const el=e.target.closest('[data-card], .tip[data-ty]');
  if(!el)return;
  showCardInfo(el.dataset.card||el.dataset.ty);
});
{let r=new URLSearchParams(location.search).get('room');if(!r){try{r=sessionStorage.getItem('sj_room');sessionStorage.removeItem('sj_room')}catch(e){}}if(r){NET.code=r.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);VIEW='online'}}
/* Androidの「戻る」で対戦が終わらないように：履歴に1段だけ見張りを積み、戻るを横取りする */
function guardHist(){try{if(!(history.state&&history.state.sj))history.pushState({sj:1},'')}catch(e){}}
function quitAsk(){
  if(document.getElementById('quitAsk'))return;
  const online=!!(S&&S.online);
  modal(`<div id="quitAsk"><h2>対戦をやめますか？</h2><p>${online?'やめると降参になり、負けとして記録されます。':'やめると降参になります（この対戦は負けになります）。'}</p><div class="btns"><button type="button" class="b" id="qaStay">続ける</button><button type="button" class="b danger" id="qaQuit">降参してやめる</button></div></div>`,(m,done)=>{
    m.querySelector('#qaStay').onclick=()=>done();
    m.querySelector('#qaQuit').onclick=()=>{done();if(!S||S.over)return;if(S.guest)NET.send({t:'cmd',c:'resign'});else gameOver(S.cpu)};
  });
}
addEventListener('popstate',()=>{
  const live=VIEW==='battle'&&S&&!S.over&&!(typeof SP!=='undefined'&&SP);
  if(live){guardHist();quitAsk();return}
  if(VIEW!=='menu'){guardHist();const m=$('#modal');if(m&&!m.hidden){m.hidden=true;m.innerHTML=''}if(VIEW==='online'&&(NET.conn||NET.peer))netLeave();else go('menu');return}
});
addEventListener('beforeunload',e=>{if(VIEW==='battle'&&S&&!S.over){e.preventDefault();e.returnValue=''}});
draw_();
guardHist();
LADDER.init();
</script>

</body></html>
