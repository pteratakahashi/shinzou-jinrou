<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>心臓人狼 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a night-time card table. Opponent across the top, the deduction board in the middle, your hand fanned at the bottom. Single dark look by choice. */
:root{
  --table:#11152a; --panel:#1d2346; --panel2:#283058; --line:#3a4476;
  --ink:#efe8d4; --muted:#a0a8ca; --candle:#e9a64c; --blood:#dc525c; --good:#6cc595;
  --c-info:#4f86d9; --c-atk:#c9424f; --c-grd:#3a9c76; --c-sup:#c39029; --c-one:#9563d6;
  --display:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--table);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;background-image:radial-gradient(ellipse at 50% 0%,#232a55 0%,var(--table) 60%);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.04em;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
.b{font-weight:700;border-radius:8px;padding:10px 18px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.b.primary{background:var(--candle);border-color:var(--candle);color:#1b1408}
.b.danger{border-color:var(--blood);color:var(--blood)}
.b.small{padding:6px 12px;font-size:12px}
.b:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.zone{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:20px}

/* ---- the card ---- */
.tcg{--cc:var(--c-sup);position:relative;aspect-ratio:5/7;border-radius:.7em;background:linear-gradient(170deg,#2c3462,#161b36);border:.2em solid var(--cc);display:flex;flex-direction:column;padding:.38em;gap:.32em;color:var(--ink);box-shadow:0 .35em .9em rgba(0,0,0,.45);overflow:hidden;text-align:left;flex:none;max-width:100%}
.cat-info{--cc:var(--c-info)}.cat-atk{--cc:var(--c-atk)}.cat-grd{--cc:var(--c-grd)}.cat-sup{--cc:var(--c-sup)}.cat-one{--cc:var(--c-one)}
.tname{display:flex;justify-content:space-between;align-items:center;gap:.3em;font-family:var(--display);font-size:1.15em;line-height:1.15;padding:.12em .35em;background:rgba(0,0,0,.38);border-radius:.3em}
.tname .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.atb{font-family:var(--body);font-weight:700;font-size:.62em;width:1.5em;height:1.5em;display:inline-grid;place-items:center;border-radius:50%;background:var(--ac);color:#140c1c;flex:none;margin-left:auto;box-shadow:0 0 .4em var(--ac)}
.atb.pl{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.tcg.s .atb{display:none}
.atTag{display:inline-block;font-size:11px;font-weight:700;padding:0 .5em;margin-left:.4em;border-radius:99px;background:var(--ac);color:#140c1c;vertical-align:middle}
.atTag.pl{background:rgba(255,255,255,.2);color:#fff}
.gem{font-family:var(--body);font-weight:700;font-size:.62em;padding:.05em .45em;border-radius:99px;background:rgba(255,255,255,.14);flex:none}
.r-R .gem{background:#b9c7e8;color:#1a2140}
.r-L .gem{background:linear-gradient(90deg,#f3cf6d,#e9a64c);color:#2a1a00}
.tart{flex:1;min-height:0;border-radius:.4em;overflow:hidden;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--cc) 85%,#fff 15%),color-mix(in srgb,var(--cc) 30%,#0a0d1c) 78%);display:flex;align-items:center;justify-content:center;position:relative}
.glyph{font-family:var(--display);font-size:3.3em;line-height:1;color:rgba(255,255,255,.94);text-shadow:0 .06em .25em rgba(0,0,0,.55)}
.catl{position:absolute;left:.3em;bottom:.25em;font-size:.6em;letter-spacing:.1em;padding:0 .4em;border-radius:.3em;background:rgba(10,13,28,.72)}
.tart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;image-rendering:pixelated;border-radius:inherit}
.tart img{-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 99%);mask-image:linear-gradient(to bottom,#000 80%,transparent 99%)}
.ttext{font-size:.82em;line-height:1.38;background:rgba(0,0,0,.38);border-radius:.3em;padding:.32em .42em;min-height:5em;overflow:hidden}
.el{display:block}.el+.el{margin-top:.15em}
.ek{display:inline-block;font-size:.78em;font-weight:700;line-height:1.3;padding:0 .4em;margin-right:.35em;border-radius:.3em;vertical-align:.05em;background:rgba(255,255,255,.14);color:var(--ink)}
.ek-cost{background:#7a2230;color:#ffd9dd}.ek-eff{background:#2b3f73;color:#dbe6ff}.ek-res{background:#6b4c12;color:#ffe7b0}.ek-raid{background:#5a1a1a;color:#ffc2c2}.ek-cond{background:#3d3d55;color:#e2e2f5}
.r-R{box-shadow:0 0 0 .08em #c9d6f5 inset,0 .35em .9em rgba(0,0,0,.45)}
/* シングル（レジェンダリー）：虹色に回る枠、星の散る黒紫の地、金の名札 */
@property --la{syntax:'<angle>';inherits:false;initial-value:0deg}
.r-L{border:.36em solid transparent;outline:.06em solid rgba(255,211,107,.85);outline-offset:-.42em;background:
  radial-gradient(circle at 20% 15%,rgba(255,230,160,.18) 0 .08em,transparent .1em) 0 0/1.6em 1.6em padding-box,
  radial-gradient(circle at 70% 60%,rgba(200,170,255,.22) 0 .06em,transparent .08em) 0 0/1.1em 1.1em padding-box,
  linear-gradient(165deg,#2b1640,#120a24 60%,#1d0f2e) padding-box,
  conic-gradient(from var(--la),#ffd36b,#ff7ad9,#b48cff,#7af0ff,#9dffb0,#ffd36b) border-box;
  box-shadow:0 0 1.2em rgba(255,122,217,.35),0 0 2.2em rgba(122,240,255,.18),0 .35em .9em rgba(0,0,0,.5);animation:legRot 4s linear infinite}
@keyframes legRot{to{--la:360deg}}
.r-L .tname{background:linear-gradient(90deg,#4a2a00,#8a6418 50%,#4a2a00);color:#fff1c4;text-shadow:0 0 .4em rgba(255,210,110,.8),0 1px 0 #000;box-shadow:0 0 0 .06em #ffd36b inset}
.r-L .gem{background:conic-gradient(from var(--la),#ffd36b,#ff7ad9,#7af0ff,#ffd36b);color:#2a1400;animation:legRot 4s linear infinite}
.r-L .tart{background:radial-gradient(circle at 50% 38%,#fff2c6 0%,#e7a8ff 22%,#7b49c8 48%,#1a0c33 82%);box-shadow:0 0 0 .07em rgba(255,211,107,.7) inset}
.r-L .catl{background:linear-gradient(90deg,#8a6418,#ffd36b);color:#2a1400;font-weight:700}
.r-L .ttext{background:rgba(20,8,36,.72);box-shadow:0 0 0 .05em rgba(255,211,107,.35) inset}
.r-L::before{content:"";position:absolute;inset:.12em;pointer-events:none;z-index:2;
  background:
   radial-gradient(circle,#fff6d0 0 .12em,#ffd36b .13em .2em,transparent .21em) 0 0/.6em .6em no-repeat,
   radial-gradient(circle,#fff6d0 0 .12em,#ffd36b .13em .2em,transparent .21em) 100% 0/.6em .6em no-repeat,
   radial-gradient(circle,#fff6d0 0 .12em,#ffd36b .13em .2em,transparent .21em) 0 100%/.6em .6em no-repeat,
   radial-gradient(circle,#fff6d0 0 .12em,#ffd36b .13em .2em,transparent .21em) 100% 100%/.6em .6em no-repeat}
@media (prefers-reduced-motion:reduce){.r-L,.r-L .gem{animation:none}}
.r-L::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.28) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.2s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.tcg.s{width:56px;font-size:8.5px}
.tcg.s .tname{font-size:1.05em}
.tcg.m{width:86px;font-size:10px}
.tcg.p{width:100%;font-size:11px}
.tcg.l{width:min(230px,64vw);font-size:15px}
.tcg.back{--cc:#8a6a34;background:#16142f url(scenes/back.png) center/100% 100% no-repeat;image-rendering:pixelated;padding:0;border-width:.12em;align-items:center;justify-content:flex-end}
.tcg.back .bk{display:none}
.tcg.back .bl{font-size:.8em;color:var(--ink);background:rgba(8,8,20,.75);border-radius:.3em;padding:0 .4em;margin-bottom:12%}

/* ---- menu ---- */
.hero{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:8px 0}
.hero h1{font-size:clamp(34px,9vw,52px);line-height:1.05}
.hero h1 span{color:var(--blood)}
.hero p{margin:0;max-width:52ch;color:var(--muted)}
.fan{display:flex;padding:8px 0 6px 20px}
.fan .tcg{margin-left:-20px;transform-origin:50% 120%}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mi{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.mi b{font-family:var(--display);font-weight:400;font-size:19px}
.mi span{font-size:12px;color:var(--muted)}
.mi.main{background:linear-gradient(135deg,#4a2230,#2a1d3e);border-color:var(--blood)}
.mi:disabled{opacity:.45;cursor:not-allowed}
.mmCard{align-items:center;text-align:center}
.mmSpin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--candle);animation:mmSpin 1s linear infinite}
@keyframes mmSpin{to{transform:rotate(360deg)}}
.sndSet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.sndSet input[type=range]{flex:1;min-width:90px;max-width:220px;accent-color:var(--candle)}
.rankCard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin:4px 0 12px}
.rankCard .btns{margin:0}
.rkTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rkMain{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rkRate{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.rkSub{color:var(--muted);font-size:13px}
.rkTier{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;color:var(--tc);text-shadow:0 0 14px color-mix(in srgb,var(--tc) 45%,transparent)}
.rkTier small{font-size:.6em}
.rkBar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.rkBar i{display:block;height:100%;background:var(--tc);border-radius:inherit}
.rkLadder{display:flex;gap:4px}.rkLadder i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}.rkLadder i.done{background:color-mix(in srgb,var(--tc) 55%,transparent)}.rkLadder i.cur{background:var(--tc);box-shadow:0 0 6px var(--tc)}
.tier{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#141625;background:var(--tc);white-space:nowrap}
.board{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto}
.board li{display:grid;grid-template-columns:2.4em 1fr auto 3.4em 3.4em;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--panel2,rgba(255,255,255,.04));font-size:14px;font-variant-numeric:tabular-nums}
.board li.me{outline:1.5px solid var(--candle)}
.board .bdPos{color:var(--muted);text-align:right}.board .bdName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.board .bdRate,.board .bdWl{text-align:right}.board .bdWl{color:var(--muted);font-size:12px}
ul.board li{grid-template-columns:4.6em 1fr 3.4em 3.4em}
.bdRes{font-weight:700;color:var(--muted)}.bdRes.w{color:var(--candle)}.bdRes.l{color:var(--blood)}
.rateLine{margin:0;font-size:14px;color:var(--muted)}.rateLine b{color:var(--ink)}
.statline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.statline b{color:var(--ink)}

/* ---- packs ---- */
.packStage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.pack{width:170px;aspect-ratio:5/7.4;border-radius:10px;border:0;cursor:pointer;background:linear-gradient(160deg,#5c2340,#2b1b4c 60%,#191a3a);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 2px #e9a64c inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.pack .pk1{font-family:var(--display);font-size:30px;color:#f3d9a8}
.pack .pk2{font-size:11px;letter-spacing:.3em;color:#e9a64c}
.pack .pkh{font-size:54px;color:var(--blood);text-shadow:0 0 18px rgba(220,82,92,.7);font-family:var(--display)}
.pack:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
.pack.shake{animation:shake .45s ease-in-out 2}
.pack.tear{animation:tear .45s ease-in forwards}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes tear{to{transform:scale(1.25) translateY(-30px);opacity:0}}
.reveal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
@media (max-width:560px){.reveal{grid-template-columns:repeat(3,minmax(0,1fr))}}
.reveal.reveal6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:640px){.reveal.reveal6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flip{border:0;background:none;padding:0;cursor:pointer;perspective:800px;animation:deal .45s ease-out both;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.flip .inner{position:relative;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;aspect-ratio:5/7}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .face .tcg{width:100%;height:100%}
.flip .front{transform:rotateY(180deg)}
.flip.on.rr-R .front .tcg{animation:glowR 1s ease-out}
.flip.on.rr-L .front .tcg{animation:glowL 1.4s ease-out}
@keyframes glowR{0%{box-shadow:0 0 40px 10px #b9c7e8}}
@keyframes glowL{0%{box-shadow:0 0 60px 20px #f3cf6d;transform:scale(1.08)}}
@keyframes deal{from{transform:translateY(-60px) rotate(-10deg);opacity:0}}
.res{font-size:11px;text-align:center;min-height:1.4em;font-weight:700;visibility:hidden}
.flip.on .res{visibility:visible}
.res.new{color:var(--candle)}.res.dup{color:var(--muted)}

/* ---- deck builder ---- */
.fpWrap{display:flex;gap:8px;align-items:center;margin:6px 0}.fpList{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip.fp{white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}.chip.fp small{font-size:10px;opacity:.75}
.fBar{position:sticky;bottom:0;z-index:6;background:var(--table);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fCpu{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.fcCat{font-size:12px}
.dkHead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--table);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.count{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.count.ok{color:var(--good)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer}
.chip.on{background:var(--panel2);border-color:var(--candle);color:var(--candle)}
.dkList{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.dk{display:flex;gap:10px;align-items:stretch;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.dk.in{border-color:var(--candle);background:linear-gradient(90deg,#3a2f2a,var(--panel))}
.dk.lock{cursor:not-allowed}
.dk.lock .tcg{filter:grayscale(1) brightness(.6)}
.dk .info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.dk .nm{font-family:var(--display);font-size:16px}
.dk .ef{font-size:12px;color:var(--muted);line-height:1.45}
.dk .own{font-size:11px;font-variant-numeric:tabular-nums;margin-top:auto;display:flex;gap:8px;align-items:center}
.own .pips{letter-spacing:2px;color:var(--candle)}
.own .pips i{font-style:normal;color:var(--line)}
.inTag{font-size:10px;padding:1px 8px;border-radius:99px;background:var(--candle);color:#1b1408;font-weight:700}

/* ---- battle ---- */
.side{position:relative}
.side.active{border-color:var(--candle);box-shadow:0 0 0 1px var(--candle),0 0 24px rgba(233,166,76,.15)}
.side.shake{animation:hit .5s ease-in-out}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-family:var(--display);font-size:19px}
.lives{display:inline-flex}
.lives i{font-style:normal;color:var(--line)}
.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.warn{border-color:var(--blood);color:var(--blood)}
.badge.ok{border-color:var(--good);color:var(--good)}
.tableRow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.slot{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10px;color:var(--muted)}
.emptySlot{width:56px;aspect-ratio:5/7;border:1px dashed var(--line);border-radius:6px}
.deckPile{width:56px;aspect-ratio:5/7;border-radius:6px;background:#16142f url(scenes/back.png) center/100% 100% no-repeat;image-rendering:pixelated;border:1px solid #8a6a34;box-shadow:2px 2px 0 #3a2c18,4px 4px 0 #1d1838;display:flex;align-items:flex-end;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000,0 0 6px #000;padding-bottom:18%}
.oppHand{display:flex;padding-left:14px;flex:1;min-width:0;overflow:hidden;align-self:center}
.oppHand .tcg{margin-left:-14px}
.tracker .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.tt{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--cc);border-radius:6px;padding:5px 6px;display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left}
.tt .tn{font-family:var(--display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .tn small{font-family:var(--body);font-size:9px;color:var(--candle);margin-left:3px}
.dots{font-size:11px;letter-spacing:2px;color:var(--candle)}
.dots i{font-style:normal;color:var(--line)}
.pp{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tt.out{opacity:.3}
.tt.out .tn{text-decoration:line-through}
.tt.hot{border-color:var(--candle);border-left-color:var(--cc)}
.pick{cursor:pointer}
.pick.on{box-shadow:0 0 0 2px var(--candle) inset}
.toggle{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

.lastLog{font-size:13px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.25);border-left:3px solid var(--line);min-height:2.6em}

.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 4px 8px;scroll-padding:8px}
.hc{background:none;border:0;padding:0;cursor:pointer;transition:transform .15s;position:relative;flex:none}

.hc.sel .tcg{outline:3px solid var(--candle);outline-offset:1px}
.hc.drawn{animation:drawIn .5s ease-out both}

.hc .twin{position:absolute;top:-8px;left:4px;font-size:9px;background:var(--blood);color:#fff;border-radius:99px;padding:0 6px;z-index:1}

.hc{-webkit-touch-callout:none;user-select:none}
.hc .twin.res{background:var(--candle);color:#1b1408}
.hc.glow .tcg{box-shadow:0 0 0 2px var(--candle),0 0 16px 3px rgba(233,166,76,.55);animation:resGlow 1.6s ease-in-out infinite}
@keyframes resGlow{50%{box-shadow:0 0 0 2px var(--candle),0 0 26px 8px rgba(233,166,76,.85)}}
.detail.resnote{color:var(--candle);font-weight:700}
.banner.res{color:var(--candle);letter-spacing:.5em}
.actions{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.phase{font-size:13px;font-weight:700}
.detail{font-size:12px;color:var(--muted)}
.log{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:12px}
.log div{padding-left:8px;border-left:2px solid var(--line)}
.log .me{border-color:var(--candle)}.log .cpu{border-color:var(--blood)}.log .sys{color:var(--muted)}
details.zone{display:block}
summary{cursor:pointer;font-weight:700}
details .in{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;max-width:64ch}

/* ---- fx layer ---- */
#fx{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center}
.fxcard{animation:fxIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.fxcard.out-me{transition:transform .35s ease-in,opacity .35s;transform:translateY(30vh) scale(.3);opacity:0}
.fxcard.out-cpu{transition:transform .35s ease-in,opacity .35s;transform:translateY(-30vh) scale(.3);opacity:0}
.fxcard .by{text-align:center;font-size:12px;margin-top:6px;color:var(--muted);text-shadow:0 1px 3px #000}
@keyframes fxIn{from{transform:rotateY(90deg) scale(.5);opacity:0}}
.banner{font-family:var(--display);font-size:clamp(26px,7vw,40px);padding:10px 0;width:100%;text-align:center;background:linear-gradient(90deg,transparent,rgba(10,12,28,.92) 20%,rgba(10,12,28,.92) 80%,transparent);animation:bn 1s ease-in-out both;letter-spacing:.15em}
.banner.me{color:var(--candle)}.banner.cpu{color:var(--blood)}
@keyframes bn{0%{transform:translateX(-60%);opacity:0}25%,75%{transform:none;opacity:1}100%{transform:translateX(60%);opacity:0}}
.stampWrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.stamp{font-family:var(--display);font-size:clamp(40px,12vw,72px);padding:0 18px;border:5px solid currentColor;border-radius:10px;transform:rotate(-12deg);animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both;background:rgba(10,12,28,.75)}
.stamp.hit{color:var(--blood)}.stamp.miss{color:var(--muted)}.stamp.guard{color:var(--good)}
.stampWrap .tcg{animation:fxIn .45s both}
.stampWrap .stamp{position:absolute;top:35%}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.guessCall{font-family:var(--display);font-size:clamp(22px,6vw,32px);background:rgba(10,12,28,.9);padding:10px 22px;border-radius:10px;border:1px solid var(--line);animation:fxIn .3s both}

/* ---- modal ---- */
#rulesOv{position:fixed;inset:0;z-index:35;background:rgba(6,8,18,.85);overflow-y:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#rulesOv .rOvIn{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--candle);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
#rulesOv h2{margin:0;font-size:17px}
.rOvCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.rOvCards .cardBtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(6,8,18,.8);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--candle);border-radius:14px;padding:16px;width:100%;max-width:620px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:sheetIn .25s ease-out}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-size:20px}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.cardPick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cardPick button{background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.cardPick button.on .tcg{outline:3px solid var(--candle)}
.cardPick .pcRow{display:none}
@media (max-width:700px){
  .cardPick{grid-template-columns:minmax(0,1fr);gap:6px}
  .cardPick .pcBig{display:none}
  .cardPick .pcRow{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 8px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line);border-left:4px solid var(--cc)}
  .cardPick button.on .pcRow{border-color:var(--candle);border-left-color:var(--candle);background:color-mix(in srgb,var(--candle) 16%,var(--panel2));box-shadow:0 0 0 1px var(--candle) inset}
  .cardPick button.on .tcg{outline:none}
  .pcThumb .tcg.s{width:52px;font-size:7.5px}
  .pcInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pcName{font-family:var(--display);font-size:16px;line-height:1.2;color:var(--ink)}
  .pcName small{font-family:var(--body);font-size:10px;color:var(--muted);margin-left:6px}
  .pcEff{font-size:11.5px;line-height:1.4;color:var(--ink)}
  .pcEff .el+.el{margin-top:1px}
  .pcChk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
  .cardPick button.on .pcChk{border-color:var(--candle);background:var(--candle);box-shadow:inset 0 0 0 4px var(--panel2)}
  .sheet:has(.cardPick) .pickBtns{position:sticky;bottom:-16px;margin:0 -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--panel) 30%)}
  .sheet:has(.cardPick) .pickBtns .b{flex:1;min-height:46px;font-size:16px}
  .sheet:has(.cardPick)>h2{font-size:19px;margin:0}
  .sheet:has(.cardPick)>p{font-size:12.5px;margin:0;line-height:1.5}
}
.result{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.result .big{font-family:var(--display);font-size:44px}
.result .big.win{color:var(--candle)}.result .big.lose{color:var(--blood)}

.cardBtn{background:none;border:0;padding:0;cursor:pointer;border-radius:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;column-gap:12px;row-gap:6px}
.duo .col{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:6px;align-content:start;min-width:0}
.duo .colh{align-self:end}
.colh{display:flex;flex-direction:column;gap:1px}
.colh b{font-family:var(--display);font-weight:400;font-size:16px}
.colh span{font-size:11px;color:var(--muted)}
.colh em{font-style:normal;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.colh em.risk{color:var(--blood)}
.duo .grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.duo .tt{padding:4px 5px}
.duo .tt .tn{font-size:12px}
.duo .dots{font-size:9px;letter-spacing:1px}
.tt.mine{box-shadow:0 0 0 2px var(--blood) inset}
@media (max-width:420px){.duo{gap:8px}.duo .grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}.duo .tt .tn{font-size:11px}}
.log{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
.lg{display:flex;flex-direction:column;gap:3px}
.log .lg,.log .lgh{border-left:0;padding-left:0}
.lgh{position:sticky;top:0;background:var(--panel);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:2px 0;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.lgh.me span{color:var(--candle)}.lgh.cpu span{color:var(--blood)}
.log .lr{display:flex;gap:6px;align-items:baseline;padding:2px 0 2px 8px;border-left:3px solid var(--line);color:var(--ink)}
.log .lr.me{border-color:var(--candle)}.log .lr.cpu{border-color:var(--blood)}.log .lr.sys{color:var(--muted)}
.lk{flex:none;font-size:10px;font-weight:700;padding:0 6px;border-radius:99px;border:1px solid currentColor}
.lk.hit{color:var(--blood)}.lk.miss{color:var(--muted)}.lk.trap{color:var(--good)}.lk.cost{color:#d8a35c}.lk.info{color:#7fa9ea}
.lt{min-width:0}
.lchip{display:inline;font-weight:700;color:var(--candle);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;padding:0 1px}
.tip{cursor:pointer}
.tip:hover{border-color:var(--candle)}
.hrow{display:flex;gap:10px;align-items:center;min-width:0}
.hrow .who{width:4em;flex:none}
.hlist{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;min-width:0;flex:1}
.hi{position:relative;flex:none}
.ht{position:absolute;top:-4px;left:-2px;z-index:1;font-size:9px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:0 5px;font-variant-numeric:tabular-nums}
.info{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.infoText{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px}
.infoText .eff{font-size:15px;line-height:1.7;padding:10px 12px;border-radius:8px;background:var(--panel2)}

/* ---- stronger card-game fx ---- */
#fxc{position:fixed;inset:0;width:100vw;height:100vh;z-index:31;pointer-events:none}
#flash{position:fixed;inset:0;z-index:29;pointer-events:none;opacity:0}
#flash.red{background:radial-gradient(ellipse at center,transparent 35%,rgba(220,40,60,.55));animation:flashA .7s ease-out}
#flash.gold{background:radial-gradient(ellipse at center,rgba(255,210,120,.25),transparent 60%);animation:flashA .6s ease-out}
#flash.green{background:radial-gradient(ellipse at center,rgba(80,220,150,.25),transparent 60%);animation:flashA .6s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}
.quake{animation:quake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
.fxcard .tcg{animation:cardSlam .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardSlam{0%{transform:perspective(700px) rotateY(180deg) translateY(-60px) scale(.4);opacity:0}60%{transform:perspective(700px) rotateY(-8deg) scale(1.08);opacity:1}100%{transform:none}}
.fxcard .glowring{position:absolute;inset:-14px;border-radius:18px;box-shadow:0 0 40px 10px var(--gc);opacity:.0;animation:gr .9s ease-out .25s}
@keyframes gr{30%{opacity:.9}100%{opacity:0}}
.fxcard{position:relative}
.banner.res{font-size:clamp(30px,9vw,50px);text-shadow:0 0 18px rgba(255,200,90,.9)}
.vs{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,40px);width:100%;padding:24px 12px;background:linear-gradient(90deg,rgba(80,20,30,.92),rgba(10,12,28,.95) 45%,rgba(10,12,28,.95) 55%,rgba(60,40,10,.92));animation:vsIn .5s ease-out both}
@keyframes vsIn{from{clip-path:inset(50% 0)}to{clip-path:inset(0 0)}}
.vsSide{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vsSide b{font-family:var(--display);font-weight:400;font-size:22px}
.vsSide span{font-size:11px;color:var(--muted);text-align:center}
.vsSide.l{animation:vsL .6s cubic-bezier(.2,1.2,.4,1) both}.vsSide.r{animation:vsR .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes vsL{from{transform:translateX(-60vw)}}@keyframes vsR{from{transform:translateX(60vw)}}
.vsMid{font-family:var(--display);font-size:clamp(40px,12vw,72px);color:var(--candle);text-shadow:0 0 20px rgba(233,166,76,.8);animation:vsPop .5s .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes vsPop{from{transform:scale(3);opacity:0}}
.hc .tcg{transition:transform .12s ease-out}
.r-R::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(200,220,255,.18) 48%,transparent 60%);background-size:250% 100%;animation:shine 4.5s linear infinite;pointer-events:none}
.lives .lost{display:inline-block;animation:lifeLost .8s ease-out}
@keyframes lifeLost{0%{transform:scale(2.2);color:#fff;text-shadow:0 0 12px var(--blood)}100%{transform:none}}
.side.active::before{content:"";position:absolute;inset:-1px;border-radius:12px;pointer-events:none;box-shadow:0 0 22px rgba(233,166,76,.25);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 34px rgba(233,166,76,.45)}}
.chainTag{font-size:11px;font-weight:700;color:var(--candle)}

/* ---- announcer / heartbreak / round ---- */
.hbWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.hbHeart{position:relative;width:1em;height:1em;font-size:clamp(130px,40vw,200px);line-height:1}
.hbh{position:absolute;inset:0;color:var(--blood);text-shadow:0 0 30px rgba(239,90,104,.9);text-align:center;animation:hbIn .3s cubic-bezier(.3,1.6,.5,1) both}
.hbh.l{clip-path:polygon(0 0,52% 0,44% 30%,56% 52%,46% 75%,50% 100%,0 100%);animation:hbIn .3s both,hbL .7s .55s cubic-bezier(.5,0,.8,.4) forwards}
.hbh.r{clip-path:polygon(52% 0,100% 0,100% 100%,50% 100%,46% 75%,56% 52%,44% 30%);animation:hbIn .3s both,hbR .7s .55s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes hbIn{from{transform:scale(.2);opacity:0}}
@keyframes hbL{to{transform:translate(-60px,90px) rotate(-35deg);opacity:0}}
@keyframes hbR{to{transform:translate(60px,90px) rotate(35deg);opacity:0}}
.hbText,.roundT,.koT{font-family:var(--display);letter-spacing:.12em;white-space:nowrap}
.hbText{font-size:clamp(28px,9vw,48px);color:#fff;text-shadow:0 0 14px var(--blood),0 0 30px var(--blood);animation:txtIn .4s .45s cubic-bezier(.3,1.6,.5,1) both}
.hbSub{font-size:13px;color:var(--muted);animation:txtIn .3s .7s both}
@keyframes txtIn{from{transform:scale(2.5);opacity:0}}
.roundWrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:18px 0;background:linear-gradient(90deg,transparent,rgba(10,12,28,.94) 15%,rgba(10,12,28,.94) 85%,transparent);animation:vsIn .35s ease-out both}
.roundT{font-size:clamp(40px,13vw,76px);color:var(--candle);text-shadow:0 0 22px rgba(233,166,76,.8);animation:txtIn .45s cubic-bezier(.3,1.6,.5,1) both}
.roundT.final{color:var(--blood);text-shadow:0 0 22px rgba(239,90,104,.9)}
.roundS{font-size:13px;color:var(--muted)}
.koT{font-size:clamp(70px,24vw,140px);color:#fff;text-shadow:0 0 20px var(--blood),0 0 50px var(--blood);animation:txtIn .4s cubic-bezier(.3,1.8,.5,1) both}
/* ---- HUD (always visible) ---- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(17,21,42,.94);backdrop-filter:blur(6px);font-size:12px;font-variant-numeric:tabular-nums}
.hud .hs{display:flex;flex-direction:column;gap:1px;min-width:0}
.hud .hs.r{text-align:right;align-items:flex-end}
.hud .hn{font-family:var(--display);font-size:14px;display:flex;gap:6px;align-items:center}
.hud .hl{color:var(--blood);letter-spacing:1px}
.hud .hl i{font-style:normal;color:var(--line)}
.hud .hx{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hud .hx b{color:var(--ink)}
.hud .hx b.big{font-size:14px;color:var(--candle)}
.hud .hm{text-align:center;font-size:11px;color:var(--muted);line-height:1.2}
.hud .hm b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}
.hud .hm .watchN{display:block;margin-top:2px;color:var(--ink);white-space:nowrap}
.hud .hs.on .hn::before{content:"▶";color:var(--candle);font-size:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--table)}
/* ---- hand fits on phones ---- */
.hand.fit{overflow:visible;flex-wrap:nowrap;gap:0;padding:16px 2px 8px}
.hand.fit .hc{margin-left:calc(-1 * var(--ov,0px));transition:transform .15s,margin .15s}
.hand.fit .hc:first-child{margin-left:0}

/* ---- 2026-11-01 演出強化（シャドバ／遊戯王風）：召喚の光、レジェンドのカットイン、ターン帯、斬撃、手札の傾き ---- */
#fx .dim{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(6,8,20,.35),rgba(2,3,10,.88) 75%);animation:dimIn .25s ease-out both}
@keyframes dimIn{from{opacity:0}}
.fxcard.sum{display:flex;flex-direction:column;align-items:center;gap:8px}
.fxcard .rays{position:absolute;left:50%;top:42%;width:min(150vw,1100px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gc) 55%,transparent) 0 5deg,transparent 5deg 18deg);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 25%,transparent 62%);-webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 25%,transparent 62%);animation:raysIn .5s ease-out both,raysSpin 9s linear infinite;pointer-events:none}
.fxcard.rL .rays{background:repeating-conic-gradient(from 0deg,rgba(255,214,120,.75) 0 4deg,transparent 4deg 12deg)}
.fxcard.rR .rays{background:repeating-conic-gradient(from 0deg,rgba(210,225,255,.6) 0 4deg,color-mix(in srgb,var(--gc) 35%,transparent) 4deg 8deg,transparent 8deg 16deg)}
@keyframes raysIn{from{opacity:0;scale:.3}}
@keyframes raysSpin{to{rotate:360deg}}
.fxcard .cardWrap{position:relative;border-radius:.7em;overflow:hidden;animation:cardSlam .55s cubic-bezier(.2,1.3,.4,1) both}
.fxcard .cardWrap .tcg{animation:none}
.fxcard .glare{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 48%,rgba(255,255,255,.15) 54%,transparent 62%);background-size:300% 100%;background-position:130% 0;animation:glare .7s .5s ease-out forwards;mix-blend-mode:screen;pointer-events:none}

// タコの心臓。失う順は 左の鰓心臓 → 右の鰓心臓 → 体心臓（まん中の大きい心臓）
function octoSVG(life,prev=life,cls='',t0=0){
  life=Math.max(0,Math.min(3,life));prev=Math.max(0,Math.min(3,prev));
  const hs=OCTO_HEARTS.map((h,i)=>{
    const alive=i>=3-life,was=i>=3-prev;
    const st=alive?(was?'alive':'revive'):(was?'break':'dead');
    const sh=st!=='break'?'':Array.from({length:7},(_,j)=>{const a=j/7*Math.PI*2+.3,r=6+(j%3)*1.6;return`<rect class="osh" x="${h.w/2-.5}" y="${h.h/2-.5}" width="1" height="1" style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r-1.5).toFixed(1)}px"/>`}).join('');
    return`<g class="oh ${st} oh-${h.n}" transform="translate(${h.x} ${h.y})"><g class="ohd">${h.d}</g><g class="oha">${h.a}</g>${sh}</g>`;
  }).join('');
  // t0（壊れ始めた時刻）があれば、描き直しても動きが途中から続くようにずらす
  const bd=t0?`style="--bd:${(.25-(Date.now()-t0)/1000).toFixed(2)}s"`:'';
  return`<svg class="octo${life<prev?' hurt':''} ${cls}" ${bd} viewBox="-1 -1 34 34" shape-rendering="crispEdges" aria-hidden="true"><g class="ob">${OCTO_BODY}${hs}</g></svg>`;
}
const ROUNDW=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
async function fxRound(){
  const n=S.round||1,fin=S.me.life===1||S.cpu.life===1;
  VOICE.say(fin&&n>1?'Final round!':`Round ${ROUNDW[n]||n}!`);
  await fxShow(`<div class="roundWrap"><div class="roundT ${fin&&n>1?'final':''}">${fin&&n>1?'FINAL ROUND':'ROUND '+n}</div><div class="roundS rOcto"><span>${MYN()} ${octoSVG(S.me.life)}</span><span>${OPN()} ${octoSVG(S.cpu.life)}</span></div></div>`,1300);fxClear();
}
async function fxHeartBreak(victim,from){
  const p=victim==='me'?S.me:S.cpu,life=p.life,fr=from==null?life+1:from;
  VOICE.say('Heart break!',{pitch:.45});quake();
  // タコの心臓がはじける瞬間（約0.85秒後）に合わせて光と破片を出す
  setTimeout(()=>{hitstop(140);screenFlash('white');setTimeout(()=>screenFlash('red'),140);quake();FXC.burst('#ef5a68',110,11);FXC.ring('#ef5a68');FXC.ring('#ffffff')},850);
  await fxShow(`<div class="hbWrap"><div class="hbOcto">${octoSVG(life,fr,'',Date.now()-(.25-.35)*1000)}</div><div class="hbText">HEART BREAK</div><div class="hbSub">${victim==='me'?MYN():OPN()}の心臓 残り${life}つ</div></div>`,1900);fxClear();
}

  const c=C[k];if(own(k)>=maxOwn(k)){SV.shards+=SHARD[c.r];return{type:'dup',txt:`かけら+${SHARD[c.r]}`}}
  SV.coll[k]=maxOwn(k);

}
function deckIssues(){
  const d=SV.deck,iss=[];
  if(d.types.length!==13)iss.push(`シングル以外のカードを13種選んでください（今${d.types.length}種）`);
  if(d.types.some(k=>own(k)<3))iss.push('3枚そろっていない種類があります');
  if(!d.single||own(d.single)<1)iss.push('シングルカードを1枚選んでください');
  return iss;
}

let P=null;
function genPack(){
  const Cp=CARDS.filter(c=>c.r==='C'),Rp=CARDS.filter(c=>c.r==='R'),Lp=CARDS.filter(c=>c.r==='L'&&!c.st);
  return[rand(Cp),rand(Cp),rand(Cp),Math.random()<.3?rand(Rp):rand(Cp),Math.random()<.15?rand(Lp):rand(Rp)].map(c=>c.k);
}
function renderPacks(){
  const canEx=SV.shards>=PACK_COST;

    body=`<div class="packStage">

    </div>`;
  }else{
    const all=P.cards.every(c=>c.on);

    <div class="btns" style="justify-content:center">${all?`<button type="button" class="b primary" id="again" ${SV.packs?'':'disabled'}>次のパック（残り${SV.packs}）</button>`:`<button type="button" class="b primary" id="flipAll">すべてめくる</button>`}</div>`;
  }
  $('#app').innerHTML=`<div class="top"><h1>パック開封</h1><div class="btns"><span class="muted">残り ${SV.packs}パック</span><button type="button" class="b small" id="back">戻る</button></div></div>${body}`;
  $('#back').onclick=()=>go('menu');
  const pb=$('#packBtn');

    if(!SV.packs)return;pb.disabled=true;
    SV.packs--;const ks=genPack();P={cards:ks.map(k=>({k,res:addCard(k),on:false}))};save();
    pb.classList.add('shake');await sleep(900);pb.classList.remove('shake');pb.classList.add('tear');await sleep(450);
    renderPacks();
  };
  const ex=$('#exBtn');if(ex)ex.onclick=()=>{if(SV.shards<PACK_COST)return;SV.shards-=PACK_COST;SV.packs++;save();renderPacks()};
  document.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const c=P.cards[+b.dataset.i];if(c.on)return;c.on=true;b.classList.add('on');{const rr=C[c.k].r;if(rr==='L'){setTimeout(()=>{SFX.legend();screenFlash('gold')},350)}else if(rr==='R')setTimeout(()=>{SFX.rare();screenFlash('silver')},350);else SFX.flip()}b.style.animation='none';if(P.cards.every(x=>x.on))setTimeout(renderPacks,RM?0:600)});

}

async function dealHeart(p,title,sub,n=6){
  // 全カードを混ぜて6枚引き、その中から1枚を心臓にする（残り5枚が手札）
  const cards=shuffle([...p.pool]);const six=cards.splice(0,n);
  let pool=six.filter(c=>!(c.type==='mirror'&&p.f.mirrorUsed));if(!pool.length)pool=six;
  let h;
  if(p.isCpu)h=rand(pool);
  else{render();h=await by(p,()=>pickCard(pool,title,sub))}

  return h;
}

function triggerNow(owner){
  const c=owner.setCard;owner.setCard=null;owner.discard.push(c);K(opp(owner)).known.add(c.id);
  S.hist.push({who:whoOf(owner),k:c.type,turn:S.turnNo});
  log(`${owner.name}の伏せカード〈${N(c.type)}〉が発動！`,whoOf(owner));

  if(owner.lastAttr&&owner.lastAttr===C[c.type].attr){draw(owner,1);log(`共鳴！（${C[c.type].attr}の属性）1枚引く。`,whoOf(owner));learnNot(owner,1)}
  // 発動した伏せカードも「直前に使ったカード」になる。次の自分のターンに同じ属性を使えば共鳴する
  owner.lastCat=C[c.type].cat;if(C[c.type].attr)owner.lastAttr=C[c.type].attr;

function decoyPenalty(p){
  if(p.f.safe){p.f.safe=false;log('ペナルティなし。');return}
  const n=2+(p.f.harsh?1:0);
  for(let i=0;i<n&&p.hand.length;i++){const x=rand(p.hand);toDiscard(p,x);log(`影武者の罰：${p.name}は〈${N(x.type)}〉を捨てた。`)}
}

  rm(p.hand,c);
  if(p.setCard){const old=p.setCard;p.discard.push(old);K(opp(p)).known.add(old.id);log(`${p.name}は伏せていた〈${N(old.type)}〉を捨てた。`,whoOf(p))}
  p.setCard=c;log(`${p.name}はカードを1枚伏せた。`,whoOf(p));SFX.set();

function draw(p,n){
  const got=[];
  if(p.f.poisoned){if(n>0&&S.turnNo)log(`毒：${p.name}はカードを引けない。`);return got}
  for(let i=0;i<n;i++){
    if(!p.deck.length){if(!S.over){log(`${p.name}は山札がなくなり、カードを引けなかった。`,'sys');S.deckOut=whoOf(p);gameOver(opp(p))}break}
    const c=p.deck.pop();p.hand.push(c);got.push(c);
  }
  return got;
}
function toDiscard(p,c){rm(p.hand,c);p.discard.push(c);K(opp(p)).known.add(c.id)}
function forcedDiscard(victim,c,attacker){
  if(!victim.f.reflect&&hasSet(victim,'reflect')){triggerNow(victim);victim.f.reflect=true;log('反射！捨てる効果が跳ね返った。',whoOf(victim))}
  if(victim.f.reflect){
    if(attacker.hand.length){const x=rand(attacker.hand);toDiscard(attacker,x);log(`${attacker.name}の手札から〈${N(x.type)}〉が捨てられた。`);if(x.type==='nekomata')nekoCurse(attacker)}
    return;
  }
  toDiscard(victim,c);log(`${victim.name}の手札から〈${N(c.type)}〉が捨てられた。`);
  if(c.type==='nekomata')nekoCurse(victim);
}

function probs(obs){
  const t=opp(obs),k=K(obs),cnt={};
  k.known.forEach(id=>{const c=S.byId[id];if(c&&c.owner===t)cnt[c.type]=(cnt[c.type]||0)+1});
  const w={};let sum=0;
  for(const ty of typesOf(t)){
    let v=0;
    if(!k.excluded.has(ty)&&(!k.allowed||k.allowed.has(ty))){const n=copies(t,ty);v=Math.max(0,n-(cnt[ty]||0))/n}
    w[ty]=v;sum+=v;
  }
  if(!sum){
    // 判定が矛盾したとき（妖狐の入れ替え後など）は、判定を捨てて枚数だけで考える
    for(const ty of typesOf(t)){const n=copies(t,ty);w[ty]=Math.max(0,n-(cnt[ty]||0))/n;sum+=w[ty]}
  }
  for(const ty in w)w[ty]=sum?w[ty]/sum:0;
  return{w,cnt};
}

function pickTypes(target,count,title,sub,cancelable,viewer){

/* ---- choices that differ for CPU / player ---- */
async function chooseTypes(p,n,title,sub){
  if(!p.isCpu){
    // 候補がもう選ぶ数以下なら、選ばせても意味がないので候補を全部入れて自動で判定する
    const live=ranked(p).filter(e=>e[1]>0).map(e=>e[0]);
    if(live.length&&live.length<=n){log(`候補が残り${live.length}種なので、選ばずにそのまま判定する。`,whoOf(p),whoOf(p));return live.concat(shuffle(typesOf(opp(p)).filter(t=>!live.includes(t)))).slice(0,n)}
    return by(p,()=>pickTypes(opp(p),n,title,sub,false,p));
  }
  let r=ranked(p).filter(e=>e[1]>0).map(e=>e[0]).slice(0,n);
  if(r.length<n)r=r.concat(shuffle(typesOf(opp(p)).filter(t=>!r.includes(t))).slice(0,n-r.length));
  return r;
}
function narrow(p,cand){const k=K(p);const s=new Set(cand);k.allowed=k.allowed?new Set([...k.allowed].filter(x=>s.has(x))):s}
function judge(p,set){
  const o=opp(p);const yes=set.includes(o.heart.type);
  if(yes)narrow(p,set);else set.forEach(x=>K(p).excluded.add(x));
  log(`判定：${set.map(x=>'〈'+N(x)+'〉').join('')} → ${yes?'この中に心臓がある':'この中に心臓はない'}`,whoOf(p));
}
function nekoCurse(owner){const cand=cands(owner,4);log(`猫又の祟り！${opp(owner).name}の心臓は ${cand.map(x=>'〈'+N(x)+'〉').join('')} のどれか。`,whoOf(owner))}
async function raid(p,o,had){
  if(o.hand.length<=1&&!S.over){
    o.life=Math.max(0,o.life-1);S.shake=whoOf(o);log(`襲撃！${o.name}の手札が残りわずかになった。ライフ-1（残り${o.life}）`,whoOf(p));render();
    await fxRaid();await fxHeartBreak(whoOf(o),o.life+1);S.round=(S.round||1)+1;if(o.life<=0)return gameOver(p);
    // 襲撃された側は心臓はそのままで、手札が5枚になるまで引く。襲撃した側のターンはここで終わる（宣言もできない）
    const need=Math.max(0,5-o.hand.length);const wasP=o.f.poisoned;o.f.poisoned=false;draw(o,need);o.f.poisoned=wasP;if(S.over)return;
    log(`${o.name}は手札が5枚になるまで引いた（心臓はそのまま）。`,whoOf(o));
    p.f.req=0;p.f.opt=0;p.f.guesses=0;p.f.mustGuess=false;log(`${p.name}のターンはここで終わり。`,whoOf(p));
    render();if(!S.sim)await fxRound();
  }
}
function learnNot(p,n,lab='共鳴'){
  const o=opp(p),k=K(p);
  const pool=shuffle(typesOf(o).filter(t=>t!==o.heart.type&&!k.excluded.has(t)&&(!k.allowed||k.allowed.has(t)))).slice(0,n);
  pool.forEach(t=>k.excluded.add(t));
  if(pool.length)log(`${lab}：${o.name}の心臓は ${pool.map(t=>'〈'+N(t)+'〉').join('')} ではない。`,whoOf(p));
}
function giveAway(p,n){
  const o=opp(p),k=K(o);
  const pool=shuffle(typesOf(p).filter(t=>t!==p.heart.type&&!k.excluded.has(t)&&(!k.allowed||k.allowed.has(t)))).slice(0,n);
  pool.forEach(t=>k.excluded.add(t));
  if(pool.length)log(`コスト：${p.name}の心臓は ${pool.map(t=>'〈'+N(t)+'〉').join('')} ではないと${o.name}に知られた。`,whoOf(p));
}
function cands(viewer,n){
  const t=opp(viewer),truth=t.heart.type,pw=probs(viewer).w;
  let others=shuffle(typesOf(t).filter(x=>x!==truth&&pw[x]>0));
  if(others.length<n-1)others=others.concat(shuffle(typesOf(t).filter(x=>x!==truth&&!others.includes(x))));
  const c=shuffle([truth,...others.slice(0,n-1)]);narrow(viewer,c);return c;
}
function reveal(p,cards){
  cards.forEach(x=>K(p).known.add(x.id));
  if(!cards.length)return log('見られるカードがなかった。');
  log(`${p.name}は${opp(p).name}のカード ${cards.map(x=>'〈'+N(x.type)+'〉').join('')} を見た。`,whoOf(p));
}

/* ---- card effects ---- */
// コスト：カードを使った時点で払う（口封じなどで効果を無効にされても払う）
async function payCost(p,c,R){
  const o=opp(p),w=whoOf(p);
  switch(c.type){
    case 'medium':giveAway(p,1);break;
    case 'moonqueen':{const mc=C[p.heart.type].cat;narrow(o,typesOf(p).filter(t=>C[t].cat===mc));log(`コスト：${p.name}の心臓は「${CAT[mc]}」系統だと知られた。`,w);break}
    case 'berserker':giveAway(p,R?1:2);break;
    case 'confessor':if(!R)giveAway(p,1);break;
    case 'astrologer':if(!R)giveAway(p,1);break;
    case 'vampire':case 'poisoner':if(!R)giveAway(p,1);break;
    case 'necro':giveAway(p,1);break;
    case 'detective':giveAway(p,2);break;
    case 'cursewolf':if(!R&&p.hand.length){const x=rand(p.hand);toDiscard(p,x);log(`コスト：${p.name}は〈${N(x.type)}〉を捨てた。`,w)}break;
    case 'saint':if(p.life===1){const mc=C[p.heart.type].cat;narrow(o,typesOf(p).filter(t=>C[t].cat===mc));p.f.guesses=0;const hn=p.hand.length;[...p.hand].forEach(x=>toDiscard(p,x));log(`コスト：${p.name}の心臓は「${CAT[mc]}」系統だと知られた。このターンは宣言できず、手札${hn}枚を捨てた。`,w)}break;
    case 'oracle':{const b=cands(o,3);log(`コスト：${p.name}の心臓は ${b.map(x=>'〈'+N(x)+'〉').join('')} のどれかだと知られた。`,whoOf(o));break}
    case 'fox':{
      p.f.foxPick=null;
      const pool=p.hand.filter(h=>!C[h.type].set&&h.type!=='fox');
      if(!pool.length)break;
      let x;
      if(p.isCpu)x=pool.map(h=>[h,cpuScore(p,h)]).sort((a,b)=>b[1]-a[1])[0][0];
      else{render();x=await pickCard(pool,'妖狐：化けるカードを選ぶ','選んだカードは手札に残したまま、効果だけを使います。'+(R?'（共鳴中なので公開しません）':'選んだカードは相手に公開されます。'))}
      p.f.foxPick=x;
      if(!R){K(o).known.add(x.id);log(`コスト：手札の〈${N(x.type)}〉を相手に公開した。`,w)}
      break;}
  }
}
async function playCard(p,c,copy=false){const pv=S.decider;S.decider=p;try{return await playCard0(p,c,copy)}finally{if(S)S.decider=pv}}
async function playCard0(p,c,copy=false){

  S.me.f.reflect=S.cpu.f.reflect=false;
  const at=C[c.type].attr;const R=!!at&&((p.lastAttr&&p.lastAttr===at)||!!p.f.forceRes);if(at)p.f.forceRes=false;p.lastCat=C[c.type].cat;if(!C[c.type].single)p.lastAttr=at;
  if(copy)log(`${p.name}は妖狐で〈${N(c.type)}〉に化けた。`,w);

  if(p.f.watched){

    if(same)narrow(o,typesOf(p).filter(t=>C[t].cat===C[c.type].cat));else typesOf(p).filter(t=>C[t].cat===C[c.type].cat).forEach(t=>k.excluded.add(t));

  }

  const warded=()=>{if(o.f.ward){log(`${o.name}の結界に阻まれた。`);return true}return false};
  if((C[c.type].cat==='info'||(C[c.type].cat==='atk'&&o.f.ward==='all'))&&warded()){render();return}

    case 'astrologer':judge(p,await chooseTypes(p,3,'占星術師：3種類を選ぶ','相手の心臓がこの中にあるかを判定します。'));if(R)draw(p,1);break;
    case 'medium':{

    case 'cursewolf':{const had=o.hand.length;for(let i=0;i<2&&o.hand.length;i++)forcedDiscard(o,rand(o.hand),p);await raid(p,o,had);break}

async function resolveHit(p,o){
  const w=whoOf(p);
  await fxStamp('的中','hit',o.heart.type);
  let dmg=p.f.curse?2:1;p.f.curse=false;
  const guarded=hasSet(o,'bodyguard');
  if(guarded){await triggerSet(o);dmg=0;o.f.noGuess=true;log(`用心棒が守った！ライフは減らない。そのかわり、${o.name}は次のターン宣言できない。`)}
  o.life=Math.max(0,o.life-dmg);S.shake=whoOf(o);
  if(dmg>0){S.round=(S.round||1)+1;render();await fxHeartBreak(whoOf(o),o.life+dmg)}else VOICE.say('Guard!');
  log(`的中！${o.name}の心臓は〈${N(o.heart.type)}〉。ライフ-${dmg}（残り${o.life}）`,w);
  if(o.heart.type==='mirror'&&!o.f.mirrorUsed){o.f.mirrorUsed=true;if(p.life>1){p.life=Math.max(0,p.life-1);log(`鏡の巫女の道連れ。${p.name}のライフも-1（残り${p.life}）。この試合ではもう鏡の巫女を心臓にできない。`)}else log(`鏡の巫女の道連れは、${p.name}のライフが1なので無効。この試合ではもう鏡の巫女を心臓にできない。`)}
  render();
  if(o.life<=0){await gameOver(p);return'over'}
  if(p.life<=0){await gameOver(o);return'over'}
  await rebuild(o);
  if(!S.sim&&dmg>0)await fxRound();
  if(guarded){for(let i=0;i<3&&o.hand.length;i++){const x=rand(o.hand);toDiscard(o,x);log(`用心棒の反動：${o.name}は〈${N(x.type)}〉を捨てた。`)}render()}
  return'hit';
}
async function doGuess(p,ty){
  const o=opp(p),w=whoOf(p);p.f.guesses--;p.f.mustGuess=false;
  log(`${p.name}は「${N(ty)}」と宣言した。`,w);render();await fxCall(N(ty));
  if(hasSet(o,'decoy')){await triggerSet(o);log('影武者が身代わりになった。宣言は無効（当たり外れは明かされない）。',w);decoyPenalty(p);render();return'miss'}
  if(o.heart.type===ty)return resolveHit(p,o);
  K(p).excluded.add(ty);await fxStamp('外れ','miss');log('外れ。',w);
  if(p.f.curse){p.f.curse=false;p.life=Math.max(0,p.life-1);S.shake=w;log(`呪術師の反動。${p.name}のライフ-1（残り${p.life}）`,w);render();if(p.life<=0){await gameOver(o);return'over'}}
  if(hasSet(o,'watchman')){await triggerSet(o);draw(o,2);learnNot(o,3,'夜警');log(`夜警：${o.name}は2枚引いた。`,whoOf(o))}
  if(p.f.safe){p.f.safe=false;log('ペナルティなし。')}
  else{
    const trap=hasSet(o,'trapper');if(trap){await triggerSet(o);log('罠師の罠！追加で3枚捨てる。')}
    const n=(p.f.soft?1:2)+(trap?3:0)+(p.f.harsh?1:0)+(p.f.nun?1:0);if(p.f.harsh)log('狼少年の反動で1枚多く捨てる。');if(p.f.nun)log('修道女の戒めで1枚多く捨てる。');if(p.f.soft)log('参謀の策で、捨てる枚数が1枚減る。');
    for(let i=0;i<n&&p.hand.length;i++){const x=rand(p.hand);toDiscard(p,x);log(`${p.name}は〈${N(x.type)}〉を捨てた。`)}
  }
  render();return'miss';
}
async function rebuild(o,title='心臓を当てられた'){

}

    case 'confessor':s=live>5?4:.6;break;case 'stargazer':s=live>3?3.2:.6;break;case 'clairvoy':s=maxP>.25?4.4:(live>3?2.4:1);break;
    case 'berserker':s=o.hand.length>=2?3.2:1.5;break;case 'ghoul':s=o.hand.length?2.6:1.2;break;case 'kidnapper':s=o.hand.length?2.4:.8;break;case 'howler':s=o.hand.length>=4?2.9:2;break;
    case 'nightmare':s=o.hand.length?3:1.5;break;case 'wererat':s=o.deck.length<=8?3.5:1.6;break;case 'witch':s=o.hand.length>=2?3:1.5;break;case 'alpha':s=p.discard.filter(x=>C[x.type].cat==='atk').length>=5?3.6:2;break;
    case 'knight':s=2.4;break;case 'watchman':s=2.2;break;case 'nun':s=2;break;case 'shieldbearer':s=threat>.2?2:1.8;break;case 'lookout':s=o.setCard?3:1.6;break;
    case 'cleric':s=p.discard.some(x=>C[x.type].cat==='grd'&&x!==c)?2:.4;break;case 'exorcist':s=(K(o).excluded.size>=3?2.4+threat*3:.5);break;
    case 'banker':s=p.hand.length>=4?1.4:.6;break;case 'gravedigger':s=p.discard.length>1?1.8:.3;break;case 'messenger':s=1.9;break;case 'tactician':s=maxP>.15?2.6:1.4;break;
    case 'innkeeper':s=p.hand.length<=3?2.6:1.2;break;case 'drummer':s=2;break;case 'gambler':s=maxP>.3?3.4:.4;break;case 'moonqueen':s=live>3?4.5:1;break;
    case 'hunter':s=threat>.2?4.5:1.8;break;case 'fox':{const others=p.hand.filter(h=>h!==c&&!C[h.type].set&&h.type!=='fox').map(h=>cpuScore(p,h));s=others.length?Math.max(...others)*.95:-1;break}case 'trapper':s=2.2;break;
    case 'bodyguard':s=threat>.2?4:1.8;break;case 'decoy':s=threat>.2?4.2:2;break;
    case 'silencer':s=2.6;break;case 'reflect':s=2.2;break;case 'gatekeeper':s=2.4;break;
    case 'villager':s=p.f.boosted?1.4:(p.hand.length>2?2.6:1.8);break;case 'chief':s=2.3;break;
    case 'mason':s=p.deck.some(x=>x.type==='mason')?2.6:1.8;break;case 'mirror':s=-1;break;case 'warder':s=2;break;case 'nekomata':s=1;break;case 'baker':s=2.2;break;case 'bard':s=2.1;break;case 'alchemist':s=1.8;break;
    case 'twins':s=p.discard.some(x=>x.type==='twins')?3.2:1.6;break;case 'sage':s=p.deck.length?2:.3;break;case 'priest':s=p.discard.length>1?1.6:.2;break;
    case 'elder':s=maxP>.18?3.5:.8;break;case 'cryboy':s=maxP>.15?3.2:1.2;break;case 'executioner':s=maxP>.12?2.8:1.5;break;
    case 'prophet':s=live>3?3.4:.6;break;case 'spy':s=o.setCard?3:1.6;break;
    case 'pack':s=o.hand.length?2.6:.3;break;case 'poisoner':s=o.hand.length<=3?3.2:2;break;
    case 'bastion':s=2.2;break;case 'sentinel':s=p.setCard?2.8:1.8;break;case 'peddler':s=1.9;break;case 'apprentice':s=2;break;
    case 'whitewolf':s=o.hand.length?4.2:.2;break;case 'teller':s=new Set(p.discard.map(x=>C[x.type].cat)).size>=3?4:1;break;
    case 'greatdet':s=4.2;break;case 'oracle':s=4.6;break;case 'curser':s=maxP>.4?3.8:.4;break;case 'saint':s=p.life===1?(threat>.3?1.5:4.5):-1;break;case 'timewitch':s=p.hand.length>=4?4:1;break;
  }
  if(C[c.type].e.includes('襲撃：')&&o.hand.length<=(['wolf','pack','madman','phantom'].includes(c.type)?2:3)&&!o.f.ward)s+=3;
  if(C[c.type].attr&&!C[c.type].set&&p.lastAttr===C[c.type].attr)s+=1;
  if(C[c.type].attr&&!C[c.type].set&&p.hand.some(h=>h!==c&&C[h.type].attr===C[c.type].attr&&!C[h.type].set))s+=.3;

function cpuGuessPick(p){
  const ent=ranked(p);const pr=ent[0][1];if(p.f.mustGuess)return ent[0][0];if(!pr)return null;const h=p.hand.length;
  if(pr>=.4||(pr>=.25&&h>=5)||(p.f.safe&&pr>=.1)||(p.f.guesses>1&&pr>=.2)||(pr>=.16&&h>=8))return ent[0][0];

}
async function cpuTurn(p,plays,g){
  await sleep(900);
  const use=()=>{if(p.f.req>0)p.f.req--;else p.f.opt--};
  const freeSetNow=async()=>{
    if(!p.f.setFree||g.over)return;
    const sets=p.hand.filter(h=>C[h.type].set).map(h=>[h,cpuScore(p,h)]).sort((a,b)=>b[1]-a[1]);
    let c=sets.length?sets[0][0]:null;
    if(p.setCard&&(!c||sets[0][1]<3.2))return;
    if(!c&&p.hand.length>2&&Math.random()<.5)c=worst(p);
    if(!c)return;p.f.setFree=0;await doSet(p,c);await sleep(300);
  };
  if(p.f.setFree)await freeSetNow();
  while(!g.over&&p.hand.length&&(p.f.req>0||p.f.opt>0)){
    // ブラフ伏せ：伏せ枠が空いていれば、たまに一番いらないカードを伏せる
    if(!p.setCard&&p.f.req>0&&p.hand.length>2&&Math.random()<.15){use();await doSet(p,worst(p));await sleep(300);continue}
    const opts=p.hand.filter(h=>!(p.f.setFree===0&&RULES.freeSet&&C[h.type].set)).map(h=>[h,C[h.type].set&&p.setCard?1.5+(p.lastAttr===C[h.type].attr?0:.3):cpuScore(p,h)]).sort((a,b)=>b[1]-a[1]);
    if(!opts.length)break;
    const [c,sc]=opts[0];
    if(p.f.req<=0&&sc<2)break;
    if(p.f.req>0&&sc<1.2&&p.hand.length<6){log(`${p.name}はカードを使わなかった。`,'cpu');break}
    use();
    if(C[c.type].set&&!p.setCard)await doSet(p,c);else await playCard(p,c);
    await sleep(800);
  }
  if(p.f.setFree&&!p.setCard)await freeSetNow();
  while(!g.over&&p.f.guesses>0&&p.hand.length){
    const ty=cpuGuessPick(p);if(!ty)break;
    const r=await doGuess(p,ty);await sleep(800);
    if(r!=='miss')break;
  }
}

/* ---- player ---- */

// 画面に出す手番の状態。オンラインでは S.phase は手番の人のものなので、相手の番は「考えています」にする
function PH(){if(!S||S.over)return'none';if(S.cur&&S.cur!==S.me&&(S.phase==='play'||S.phase==='guess'))return'cpu';return S.phase}
const canSetIn=(P,ph)=>RULES.freeSet?P.f.setFree>0&&(ph==='play'||ph==='guess'):ph==='play';

async function onPlay(){return onUse(false)}
async function onSet(){return onUse(true)}
async function onUse(asSet){
  const ph=PH();if(!S.sel||S.busy)return;
  if(asSet||C[S.sel.type].set){if(!canSetIn(S.me,ph))return}else if(ph!=='play')return;
  const c=S.sel;S.sel=null;

}
async function useAs(P,c,asSet){
  if(S.cur!==P||S.busy||!P.hand.includes(c))return;
  const isSet=asSet||C[c.type].set,f=P.f;
  if(isSet?!canSetIn(P,S.phase):S.phase!=='play')return;
  S.busy=true;
  if(isSet&&RULES.freeSet)f.setFree--;else if(f.req>0)f.req--;else f.opt--;
  if(isSet)await doSet(P,c);else await playCard(P,c);
  if(S.over)return;

function onSkip(){if(PH()!=='play'||S.busy)return;S.sel=null;if(S.guest){S.busy=true;NET.send({t:'cmd',c:'skip'});render();return}skipAs(S.me)}
function skipAs(P){if(S.phase!=='play'||S.cur!==P||S.busy)return;P.f.req=0;P.f.opt=0;S.phase='guess';render()}
async function onGuess(){
  if(PH()!=='guess'||S.busy||S.me.f.guesses<=0||!S.me.hand.length)return;
  const r=await pickTypes(S.cpu,1,'心臓を宣言する',`${OPN()}の心臓だと思う種類を選んでください。外すと手札をランダムに2枚捨てます。`,true,S.me);
  if(!r)return;

async function guessAs(P,ty){
  if(S.phase!=='guess'||S.cur!==P||S.busy||P.f.guesses<=0||!P.hand.length)return;

function onEnd(){if(PH()!=='guess'||S.busy)return;if(S.me.f.mustGuess&&S.me.f.guesses>0&&S.me.hand.length)return;if(S.guest){S.busy=true;NET.send({t:'cmd',c:'end'});render();return}endAs(S.me)}
function endAs(P){if(S.phase!=='guess'||S.cur!==P||S.busy)return;if(P.f.mustGuess&&P.f.guesses>0&&P.hand.length)return;S.phase='none';render();S.endTurn()}

/* ---- flow ---- */
async function runTurn(p){
  const g=S;if(g.over)return;
  saveGame(whoOf(p));
  g.turnNo++;g.cur=p;p.f.ward=false;p.f.atkWard=false;p.f.shield=false;p.f.decoy=false;
  if(p.setCard){const c=p.setCard;p.setCard=null;p.discard.push(c);K(opp(p)).known.add(c.id);log(`${p.name}が伏せていた〈${N(c.type)}〉は発動せず、捨て札になった。`,whoOf(p))}

  p.f.req=p.f.mustPlay||1;p.f.mustPlay=0;p.f.setFree=RULES.freeSet?1:0;p.f.opt=p.f.nextOpt||0;p.f.boosted=p.f.opt>0;p.f.nextOpt=0;

  let nd=1+(p.f.extraDraw||0)+(p.f.nextDraw||0);p.f.extraDraw=0;p.f.nextDraw=0;if(p.f.skipDraw){nd=Math.max(0,nd-1);p.f.skipDraw=false;log(`${p.name}は夢魔の効果で、はじめの1枚を引けない。`)}if(p.f.noDraw){p.f.poisoned=true;p.f.noDraw=false;log(`${p.name}は毒師の効果で、このターンはカードを一切引けない。`)}
  g.phase=p.isCpu?'cpu':'none';render();
  await fxBanner(whoOf(p));
  if(g!==S)return;
  log(`― ${g.turnNo}ターン目：${p.name} ―`);
  const got=draw(p,nd);
  if(p.f.blocked)log(`${p.name}は狩人の効果でこのターン宣言できない。`);
  render();
  if(p.isCpu)await cpuTurn(p,plays,g);else await playerTurn(p,plays);
  if(g.over||g!==S)return;
  p.f.trapped=false;p.f.watched=false;p.f.poisoned=false;p.f.silenced=false;p.f.harsh=false;p.f.nun=false;p.f.soft=false;p.f.opt=0;p.f.req=0;

}

function handFit(n){
  const avail=Math.min(760,innerWidth)-32-26;const W=innerWidth<560?72:86;const gap=8;
  if(n<=1||n*(W+gap)<=avail)return{fit:false,W,ov:0};
  const step=Math.max(18,(avail-W)/(n-1));return{fit:true,W,ov:Math.max(0,W-step)};
}
function lives(p){
  // 心臓が減った／増えたら、描き直しが続いても1.8秒は動きを見せ続ける

  if(p._shownLife!=null&&p._shownLife!==p.life){p._lfFrom=p._shownLife;p._lfT0=now}
  p._shownLife=p.life;
  const anim=p._lfT0&&now-p._lfT0<1800;
  return`<span class="lives" aria-label="心臓 残り${p.life}つ">${octoSVG(p.life,anim?p._lfFrom:p.life,'',anim?p._lfT0:0)}</span>`}
function badges(p){

  if(p.f.safe)b.push(['次の宣言は外れても無傷','ok']);

/* 手札のカードを上に引っ張って、手札の列より上で離すと使う（伏せ専用は伏せる）。横に動かしたときは手札のスクロールに任せる */
function dragCard(b,e,card,cancelLp){
  const sx=e.clientX,sy=e.clientY,hand=b.closest('.hand'),line=(hand?hand.getBoundingClientRect().top:innerHeight*.6)-24;
  let ghost=null,ox=0,oy=0,over=false;
  const move=ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!ghost){
      if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy))return end();
      if(!(dy<-18&&Math.abs(dy)>Math.abs(dx)))return;
      cancelLp();
      const t=b.querySelector('.tcg'),r=t.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
      ghost=t.cloneNode(true);ghost.classList.add('dragGhost');ghost.style.width=r.width+'px';ghost.style.transform='';
      document.body.appendChild(ghost);b.classList.add('dragging');document.body.classList.add('dragOn');
    }
    ev.preventDefault();
    over=ev.clientY<line;
    ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
    ghost.style.transform=`rotate(${Math.max(-12,Math.min(12,dx/12))}deg) scale(${over?1.18:1.05})`;
    ghost.classList.toggle('ok',over);document.body.classList.toggle('dropOk',over);
  };
  const up=()=>{
    const was=ghost,ok=over;end();
    if(!was)return;
    b.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault()},{capture:true,once:true});
    if(ok&&PH()==='play'&&!S.busy){const c=card();if(c){S.sel=c;SFX.select&&SFX.select();C[c.type].set?onSet():onPlay();return}}
    render();
  };
  function end(){removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',end);
    if(ghost){ghost.remove();ghost=null}b.classList.remove('dragging');document.body.classList.remove('dragOn','dropOk')}
  addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',end);
}

const ROOM_PREFIX='shinzoujinrou-v1-',CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const NET={peer:null,conn:null,host:false,state:'idle',code:'',err:'',opp:null,ready:{me:null,cpu:null},lastDeck:null,asks:{},askN:0,sentQ:0,lastSnap:'',fxq:Promise.resolve(),leaving:false,joinTimer:0,
  specs:[],spec:false,wconn:null,specQ:0,lastSpec:'',watchNames:null,
  send(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(o)}catch(e){}},
  // 観戦している人全員に送る
  cast(o){for(const c of NET.specs)try{if(c.open)c.send(o)}catch(e){}},
  lib(){return window.Peer?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc)})},
  ask(q){NET.sync(true);return new Promise(res=>{const id=++NET.askN;NET.asks[id]=res;NET.send({t:'ask',id,...q})})},
  sync(force){
    if(!NET.conn||!S||!S.online||S.guest)return;
    const sn=netSnap(),j=JSON.stringify(sn);
    if(force||j!==NET.lastSnap){
      NET.lastSnap=j;if(sn.logs.length)NET.sentQ=sn.logs[sn.logs.length-1].q;else NET.sentQ=Math.max(NET.sentQ,LOGQ);
      NET.send({t:'snap',s:sn});

    if(!NET.specs.length)return;
    const ss=netSnap(true),js=JSON.stringify(ss);
    if(!force&&js===NET.lastSpec)return;
    NET.lastSpec=js;if(ss.logs.length)NET.specQ=ss.logs[ss.logs.length-1].q;else NET.specQ=Math.max(NET.specQ,LOGQ);
    NET.cast({t:'snap',s:ss});
  }
};

/* Googleログインは、ページの上に Google の小窓を出す方式（Google Identity Services の ID トークン）。
   小窓にはこのページの住所が出て、Supabase の住所は見せない。受け取ったトークンを Supabase に渡してログインする。
   読み込めない・失敗したときは、従来の Google のページへ移動する方式のボタンに戻す */
const GSI={client:'888128120669-nmsmsk6er3al46jmhlc8ipsq95hdfrk9.apps.googleusercontent.com',state:'idle',raw:'',err:''};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function gsiInit(){
  // 毎回新しい合言葉（nonce）。Google にはハッシュを、Supabase には元の値を渡す
  GSI.raw=hex(crypto.getRandomValues(new Uint8Array(16)));
  const hashed=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(GSI.raw)));
  google.accounts.id.initialize({client_id:GSI.client,callback:gsiDone,nonce:hashed,auto_select:false,itp_support:true,use_fedcm_for_button:true,cancel_on_tap_outside:true});
}
async function gsiLoad(){
  if(GSI.state!=='idle')return;
  GSI.state='loading';
  try{
    await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>rej(new Error('gsi'));document.head.appendChild(sc)});
    await gsiInit();GSI.state='ready';gsiRender();
  }catch(e){console.error(e);GSI.state='fail'}
}
function gsiRender(){
  if(!LADDER.on()||LADDER.uid())return;
  if(GSI.state==='idle')return gsiLoad();
  if(GSI.state!=='ready')return;
  document.querySelectorAll('[data-gsi]').forEach(el=>{
    if(el.dataset.gsiDone)return;el.dataset.gsiDone='1';
    el.innerHTML='';el.classList.add('gsiBox');
    try{google.accounts.id.renderButton(el,{type:'standard',theme:'filled_black',size:'large',text:'signin_with',shape:'pill',locale:'ja',width:240})}catch(e){console.error(e)}
  });
}
async function gsiDone(r){
  if(!LADDER.sb||!r||!r.credential)return;
  GSI.err='';
  const {error}=await LADDER.sb.auth.signInWithIdToken({provider:'google',token:r.credential,nonce:GSI.raw});
  try{await gsiInit()}catch(e){}
  if(error){
    console.error(error);
    GSI.state='fail';GSI.err='ログインできませんでした。もう一度「Googleでログイン」を押してください（Googleのページに移動してログインします）。';

  }
}

/* ランクマッチ：待機列に入って、先に待っている人がいればその部屋に入る。いなければ自分が部屋を作って待つ */
const MM={fails:0,on:false,timer:0,t0:0,waiting:0,joining:false,clock:0};
async function mmStart(){
  if(!LADDER.uid()){NET.err='ランクマッチはGoogleでログインすると遊べます。';return go('online')}
  if(NET.conn)return go('online');
  if(!MM.on)MM.fails=0;MM.on=true;MM.joining=false;MM.t0=MM.t0||Date.now();MM.waiting=0;
  clearInterval(MM.timer);MM.timer=setInterval(mmTick,4000);
  clearInterval(MM.clock);MM.clock=setInterval(()=>{const el=$('#mmTime');if(el)el.textContent=mmElapsed()},1000);
  VIEW='online';await netHost();
}
function mmElapsed(){const t=Math.floor((Date.now()-MM.t0)/1000);return`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}
async function mmTick(){
  if(!MM.on||MM.joining||NET.conn||NET.state!=='waiting'||!NET.code)return;
  const code=NET.code;
  const {data,error}=await LADDER.sb.rpc('mm_poll',{p_code:code});
  if(!MM.on||NET.code!==code||NET.conn)return;
  if(error){console.error(error);MM.errs=(MM.errs||0)+1;if(MM.errs>=2){mmStop();netReset();NET.err=/PGRST202|mm_poll/.test(error.code+error.message)?'ランクマッチの準備がサーバーにまだできていません（管理者がSQLを更新する必要があります）。':'ランクマッチのサーバーにつながりませんでした。少し待ってからもう一度試してください。';renderOnline()}return}
  MM.errs=0;
  if(data.state==='join'){MM.joining=true;netJoin(data.code)}
  else if(data.state==='wait'){MM.waiting=data.waiting||0;const el=$('#mmCount');if(el)el.textContent=MM.waiting}
}
function mmStop(){
  if(!MM.on)return;
  MM.on=false;MM.joining=false;MM.t0=0;clearInterval(MM.timer);clearInterval(MM.clock);
  if(LADDER.sb&&LADDER.uid())LADDER.sb.rpc('mm_leave').then(({error})=>{if(error)console.error(error)});
}

function netReset(){
  clearTimeout(NET.joinTimer);
  liveEnd();
  const p=NET.peer;NET.peer=null;NET.conn=null;
  NET.specs.forEach(c=>{try{c.close()}catch(e){}});
  try{if(p)p.destroy()}catch(e){}

}
function netFail(msg){if(MM.on&&++MM.fails>3)mmStop();if(MM.on){netReset();MM.joining=false;setTimeout(()=>{if(MM.on)mmStart()},800);return}netReset();NET.err=msg;VIEW='online';window.scrollTo(0,0);renderOnline()}
function netErr(e){
  const t=e&&e.type;
  if(t==='peer-unavailable')return'その部屋は見つかりませんでした。コードを確かめてください（部屋を作った人が画面を閉じると、部屋は消えます）。';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'接続サーバーにつながりませんでした。少し待ってから、もう一度試してください。';
  if(t==='browser-incompatible')return'このブラウザはオンライン対戦に対応していません。Chrome か Safari の新しい版で開いてください。';
  return`接続できませんでした（${t||'不明なエラー'}）。もう一度試してください。`;
}
async function netHost(){
  netReset();NET.err='';NET.host=true;NET.state='opening';renderOnline();
  try{await NET.lib()}catch(e){return netFail('通信の部品を読み込めませんでした。ネットにつながっているか確かめてください。')}
  const code=Array.from({length:5},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
  NET.code=code;
  const peer=NET.peer=new Peer(ROOM_PREFIX+code);
  peer.on('open',()=>{if(NET.peer!==peer)return;NET.state='waiting';if(VIEW==='online')renderOnline();if(MM.on)mmTick()});
  peer.on('connection',c=>{if(NET.peer!==peer)return;if(c.metadata&&c.metadata.watch)return specBind(c);if(NET.conn){c.on('open',()=>{try{c.send({t:'full'})}catch(e){}setTimeout(()=>c.close(),800)});return}netBind(c)});
  peer.on('disconnected',()=>{if(NET.peer===peer&&!peer.destroyed)try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(NET.peer!==peer)return;if(e.type==='unavailable-id')return netHost();if(NET.conn&&e.type!=='peer-unavailable')return;netFail(netErr(e))});
}
async function netJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5){NET.err='部屋コードは5文字です。';return renderOnline()}
  netReset();NET.err='';NET.host=false;NET.code=code;NET.state='joining';renderOnline();
  try{await NET.lib()}catch(e){return netFail('通信の部品を読み込めませんでした。ネットにつながっているか確かめてください。')}
  const peer=NET.peer=new Peer();
  peer.on('open',()=>{if(NET.peer!==peer)return;netBind(peer.connect(ROOM_PREFIX+code,{reliable:true,serialization:'json'}))});

/* ---- 観戦 ----
   部屋を作った人（ホスト）が、対戦中は20秒ごとにサーバーの一覧（live）に部屋コードを知らせる。
   観戦する人は一覧からランダムに1つ選び、ホストに「観戦」としてつなぐ。ホストは観戦者用の盤面
   （両者の手札・心臓は、相手に知られたもの以外伏せる）と演出を送る。観戦者は操作できない。
   ゲストと同じく、ホストを上・ゲストを下に描く。 */
const LIVE={timer:0,code:'',tok:''};
function liveBeat(){
  if(!LADDER.sb||!NET.host||!NET.conn||!S||!S.online||S.guest||S.over)return liveEnd();
  LADDER.sb.rpc('live_beat',{p_code:LIVE.code,p_names:`${netName()} vs ${NET.opp||'相手'}`,p_tok:LIVE.tok}).then(({error})=>{if(error)console.error(error)});
}
function liveStart(){
  liveEnd();if(!LADDER.sb||!NET.code)return;
  LIVE.code=NET.code;LIVE.tok=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/-/g,'');
  liveBeat();LIVE.timer=setInterval(liveBeat,20000);
}
function liveEnd(){
  clearInterval(LIVE.timer);LIVE.timer=0;
  if(!LIVE.code||!LADDER.sb)return;
  const p={p_code:LIVE.code,p_tok:LIVE.tok};LIVE.code='';
  LADDER.sb.rpc('live_end',p).then(({error})=>{if(error)console.error(error)});
}
// ホスト側：観戦者のつなぎ込み（8人まで）

    // 先にいる観戦者へ送り切ってから加え、新しい人には最近のログ込みの盤面をまとめて送る（以後は差分だけ）
    NET.sync(true);NET.specs.push(c);
    try{c.send({t:'hello',host:netName(),guest:NET.opp||'相手'});if(S&&S.online&&!S.guest)c.send({t:'snap',s:netSnap(true,true)})}catch(e){}
    NET.specQ=Math.max(NET.specQ,LOGQ);NET.lastSpec='';NET.sync(true);
  });
  const drop=()=>{const i=NET.specs.indexOf(c);if(i<0)return;NET.specs.splice(i,1);NET.sync(true);if(VIEW==='battle'&&S&&!S.guest)render()};
  c.on('close',drop);c.on('error',drop);
}

async function watchStart(again){

  mmStop();netReset();S=null;closeModal();

  if(!LADDER.sb)return watchFail('観戦のサーバーにつながりませんでした。少し待ってからもう一度試してください。');
  const {data,error}=await LADDER.sb.rpc('live_pick',{p_not:WATCH.last||''});

  if(error){console.error(error);return watchFail(/PGRST202|live_pick/.test(error.code+error.message)?'観戦の準備がサーバーにまだできていません（管理者がSQLを更新する必要があります）。':'観戦のサーバーにつながりませんでした。少し待ってからもう一度試してください。')}

async function netWatch(code){

}
